<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#110f2d">
  <meta name="description" content="写给清源的生日祝福">
  <title>清源，生日快乐！</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="orb orb-a"></span><span class="orb orb-b"></span><span class="orb orb-c"></span>
    <span class="star star-1">✦</span><span class="star star-2">✧</span><span class="star star-3">✦</span>
    <span class="star star-4">·</span><span class="star star-5">✧</span><span class="star star-6">·</span>
  </div>

  <main class="page-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span> A little birthday page</div>
      <button class="music-toggle" id="musicToggle" type="button" aria-pressed="false">
        <span class="music-icon">♫</span><span id="musicLabel">开启音乐</span>
      </button>
    </header>

    <section class="hero" aria-labelledby="pageTitle">
      <p class="eyebrow">TODAY IS YOUR DAY</p>
      <h1 id="pageTitle">清源，<span>十八岁生日快乐！</span></h1>
      <p class="hero-copy">愿十八岁的新篇章，快乐像星光一样闪耀，<br>想做的事都能慢慢实现。</p>
      <div class="hero-actions">
        <button class="primary-btn" id="wishButton" type="button">打开生日祝福 <span>↓</span></button>
        <span class="tiny-note">戴上耳机，点击开启背景音乐</span>
      </div>
    </section>

    <section class="memory-card" id="wishCard" aria-label="生日祝福卡片">
      <div class="image-wrap">
        <div class="halo"></div>
        <img src="qingyuan-avatar.jpg" alt="清源的头像">
        <span class="sparkle sparkle-a">✦</span><span class="sparkle sparkle-b">✧</span>
      </div>
      <div class="wish-content">
        <p class="card-kicker">FOR QINGYUAN</p>
        <h2>把今天的快乐<br><em>存成一颗星星</em></h2>
        <p class="wish-text">谢谢你一直以来的真诚和可爱。愿你在十八岁这一页，遇见很多温柔的人和闪闪发光的瞬间；累的时候有人陪，开心的时候有人分享，所有期待都能如期抵达。</p>
        <div class="signature"><span></span> 你的朋友</div>
      </div>
    </section>

    <section class="wishes" aria-label="生日关键词">
      <div class="wish-pill"><strong>01</strong><span>平安顺遂</span></div>
      <div class="wish-pill"><strong>02</strong><span>天天开心</span></div>
      <div class="wish-pill"><strong>03</strong><span>闪闪发光</span></div>
    </section>

    <footer>made with love for 清源 <span>♡</span></footer>
  </main>

  <audio id="birthdayAudio" loop preload="metadata">
    <source src="copines.mp3" type="audio/mpeg">
  </audio>
  <script src="script.js"></script>
</body>
</html>
